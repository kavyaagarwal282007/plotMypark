<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>plotMypark | Profile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <header class="top-nav">

        <div class="logo">
            plot<span>My</span>park
        </div>

        <div class="nav-actions">
            <button class="icon-btn">🔔</button>
            <button class="profile-btn">👤</button>
        </div>

    </header>


    <main class="profile-page">

        <section class="profile-header">

            <div class="profile-avatar">
                K
            </div>

            <div>
                <p class="small-text">MY ACCOUNT</p>

                <h1>Kavya Agarwal</h1>

                <p>Demo User</p>
            </div>

        </section>


        <section class="profile-card">

            <div class="profile-row">
                <span>👤</span>

                <div>
                    <small>Name</small>
                    <strong>Kavya Agarwal</strong>
                </div>
            </div>


            <div class="profile-row">
                <span>📧</span>

                <div>
                    <small>Email</small>
                    <strong>demo@plotmypark.com</strong>
                </div>
            </div>


            <div class="profile-row">
                <span>📱</span>

                <div>
                    <small>Phone</small>
                    <strong>+91 XXXXX XXXXX</strong>
                </div>
            </div>

        </section>


        <button
            class="logout-btn"
            onclick="window.location.href='index.html'"
        >
            Logout
        </button>

    </main>


    <nav class="bottom-nav">

        <button
            class="bottom-item"
            onclick="window.location.href='home.html'"
        >
            <span>⌂</span>
            <p>Home</p>
        </button>


        <button
            class="bottom-item"
            onclick="window.location.href='parking.html'"
        >
            <span>🅿️</span>
            <p>Parking</p>
        </button>


        <button
            class="bottom-item"
            onclick="window.location.href='history.html'"
        >
            <span>🧾</span>
            <p>History</p>
        </button>


        <button
            class="bottom-item active"
            onclick="window.location.href='profile.html'"
        >
            <span>👤</span>
            <p>Profile</p>
        </button>

    </nav>

</body>
</html>
